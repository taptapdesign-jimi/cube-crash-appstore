<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CubeCrash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <!-- apple-mobile-web-app-capable is legacy; mobile-web-app-capable is the new standard -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="screen-orientation" content="portrait">
  <meta name="orientation" content="portrait">
  <!-- Match the native launch screen before any external CSS or JavaScript loads. -->
  <style>
    html {
      background: #F3EEE8 !important;
      background-image: none !important;
    }
    body {
      background: linear-gradient(rgba(243,238,232,0.4), rgba(243,238,232,0.4)), url('./assets/paper-bg.png') center/100% 100% no-repeat, linear-gradient(180deg, #f3eee8 0%, #fcecdf 60%, #fcecdf 100%) !important;
      background-color: #F3EEE8 !important;
    }
  </style>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.ico">
  
  <!-- Load Baloo2 font first -->
  <link rel="stylesheet" href="./src/styles/fonts.css">
  
  <!-- Only the two parsed launch images are head-preloaded. Homepage, Journey,
       modal and gameplay art belong to the bounded current-DPR route loaders. -->
  <link rel="preload" as="image" href="./assets/logo addons/taplogo.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/logo addons/lik-board.png" fetchpriority="high">
  
  <!-- Load critical CSS -->
  <link rel="stylesheet" href="./src/style.css">
  <link rel="stylesheet" href="./src/slider-optimized.css">
  <link rel="stylesheet" href="./src/styles/cta-system.css">
  <link rel="stylesheet" href="./src/independent-navigation.css">
  <link rel="stylesheet" href="./src/collectibles-screen.css">
  
  <style>
    * { 
      box-sizing: border-box;
      /* GLOBAL: Disable text selection and long-press menu everywhere */
      -webkit-user-select: none !important;
      -webkit-touch-callout: none !important;
      -khtml-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      /* iOS: Disable text selection and long-press menu */
      -webkit-user-select: none !important;
      -webkit-touch-callout: none !important;
      user-select: none !important;
    }
    
    body {
      /* Keep the native launch screen and studio intro on one continuous surface. */
      background: linear-gradient(rgba(243,238,232,0.4), rgba(243,238,232,0.4)), url('./assets/paper-bg.png') center/100% 100% no-repeat, linear-gradient(180deg, #f3eee8 0%, #fcecdf 60%, #fcecdf 100%);
      background-color: #F3EEE8;
      background-attachment: fixed;
      background-repeat: no-repeat;
      font-family: 'Baloo2', system-ui, -apple-system, sans-serif;
      position: relative;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
    }
    
    /* launch-screen.ts preserves this same surface throughout startup. */

    /* The launch surface is intentionally transparent so body owns one paper
       texture. Occlude every deeper app root from the first parsed frame until
       launch-screen.ts performs the sole visible Homepage handoff. */
    body.cc-launch-boot-active > #ui-root,
    body.cc-launch-boot-active > #nav-root,
    body.cc-launch-boot-active > #app,
    body.cc-launch-boot-active > canvas {
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    
    #ui-root {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
    }
    
    #nav-root {
      position: relative;
      z-index: 999999;
    }
    
    /* HIDE ALL SCREENS BY DEFAULT */
    #home,
    #stats-screen,
    #collectibles-screen,
    #menu-screen,
    #collectibles-detail-modal {
      display: none !important;
      visibility: hidden !important;
    }
    
    /* Settings screen visibility handled by style.css */
    #settings-screen {
      display: none;
      visibility: hidden;
    }
    
    /* #app is controlled by JavaScript, not CSS */
    
    /* Navigation is controlled by JS, not CSS */
    #independent-nav:not([data-homepage-owner='active']) {
      visibility: hidden;
    }
    
    #home:not([hidden]) {
      display: block !important;
      visibility: visible !important;
    }
    
    #home:not([hidden]) #slider-container {
      display: block !important;
      visibility: visible !important;
    }
    
    /* Ensure stats screen is visible when shown (not hidden) */
    #stats-screen:not([hidden]) {
      display: flex !important;
      visibility: visible !important;
    }
    
    /* Ensure collectibles screen is visible when shown (not hidden) */
    #collectibles-screen:not([hidden]):not(.hidden) {
      display: flex !important;
      visibility: visible !important;
    }
    
    /* Ensure collectibles detail modal is visible when shown (not hidden) */
    #collectibles-detail-modal:not([hidden]):not(.hidden) {
      display: flex !important;
      visibility: visible !important;
    }
    
    /* No extra margin needed - navigation is separate */
  </style>
</head>
<body class="cc-launch-boot-active" style="overflow: hidden;">
  <!-- Inline launch content shares body's single viewport-relative paper surface. -->
  <div id="launch-screen" class="launch-screen" style="position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 10000 !important; display: flex !important; align-items: center !important; justify-content: center !important; background: transparent !important; opacity: 1 !important; visibility: visible !important;">
    <div class="launch-content" style="position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
      <!-- Studio presents image is the first visible web launch frame. -->
      <div class="launch-studio-presents" style="position: absolute !important; inset: 0 !important; display: flex !important; align-items: center !important; justify-content: center !important; opacity: 0 !important; visibility: visible !important;">
        <div id="launch-studio-logo-unit" class="launch-studio-logo-unit">
          <img id="launch-studio-logo" class="launch-studio-logo-art" src="./assets/logo addons/taplogo.png" alt="TapTap Design" loading="eager" fetchpriority="high" draggable="false">
          <img id="launch-studio-logo-sheen" class="launch-studio-logo-art launch-studio-logo-sheen" src="./assets/logo addons/taplogo.png" alt="" aria-hidden="true" draggable="false">
          <span class="launch-studio-presents-label">PRESENTS</span>
        </div>
        <img id="launch-studio-character" class="launch-studio-character" src="./assets/logo addons/lik-board.png" alt="" loading="eager" fetchpriority="high" draggable="false">
      </div>
    </div>
  </div>
  
  <!-- 🔥 PREMIUM: Disable image drag and long press immediately -->
  <script>
    (function() {
      function disableImageDrag(img) {
        if (!img) return;
        img.draggable = false;
        img.addEventListener('dragstart', function(e) { e.preventDefault(); });
        img.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        img.addEventListener('selectstart', function(e) { e.preventDefault(); });
        img.addEventListener('touchstart', function(e) {
          if (e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });
      }
      
      // Disable drag on launch screen images immediately
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          disableImageDrag(document.getElementById('launch-studio-logo'));
          disableImageDrag(document.getElementById('launch-studio-logo-sheen'));
          disableImageDrag(document.getElementById('launch-studio-character'));
        });
      } else {
        disableImageDrag(document.getElementById('launch-studio-logo'));
        disableImageDrag(document.getElementById('launch-studio-logo-sheen'));
        disableImageDrag(document.getElementById('launch-studio-character'));
      }
    })();
  </script>
  
  <div id="ui-root"></div>
  <div id="nav-root"></div>
  
  <script>
    // Global settings state with localStorage persistence
    function loadSettings() {
      try {
        const saved = localStorage.getItem('cc_settings');
        if (saved) {
          return JSON.parse(saved);
        }
      } catch (e) {}
      // Default settings
      return {
        hapticsEnabled: true,
        gameSoundsEnabled: false,
        musicEnabled: true,
        spatialMotionEnabled: true
      };
    }
    
    function saveSettings(settings) {
      try {
        localStorage.setItem('cc_settings', JSON.stringify(settings));
      } catch (e) {}
    }
    
    window._settings = loadSettings();
    window.__ccUserInteracted = false;
    const __ccMarkUserInteracted = () => {
      window.__ccUserInteracted = true;
      try { window.removeEventListener('pointerdown', __ccMarkUserInteracted, true); } catch (e) {}
      try { window.removeEventListener('touchstart', __ccMarkUserInteracted, true); } catch (e) {}
      try { window.removeEventListener('keydown', __ccMarkUserInteracted, true); } catch (e) {}
    };
    try { window.addEventListener('pointerdown', __ccMarkUserInteracted, true); } catch (e) {}
    try { window.addEventListener('touchstart', __ccMarkUserInteracted, true); } catch (e) {}
    try { window.addEventListener('keydown', __ccMarkUserInteracted, true); } catch (e) {}

    const __ccHapticState = {
      lastAnyAt: 0,
      lastByKey: Object.create(null),
      minAnyGapMs: 85,
      minSameGapMs: 160,
      minByStyleMs: {
        light: 120,
        medium: 95,
        heavy: 120,
        notification: 180,
        selection: 140
      }
    };

    function shouldSendHaptic(key, priority) {
      const now = Date.now();
      const lastAnyAt = __ccHapticState.lastAnyAt || 0;
      const lastSameAt = __ccHapticState.lastByKey[key] || 0;
      const minAnyGapMs = priority === 'heavy'
        ? __ccHapticState.minByStyleMs.heavy
        : priority === 'medium'
          ? __ccHapticState.minByStyleMs.medium
          : priority === 'selection'
            ? __ccHapticState.minByStyleMs.selection
            : priority === 'notification'
              ? __ccHapticState.minByStyleMs.notification
              : __ccHapticState.minAnyGapMs;
      if (now - lastAnyAt < minAnyGapMs) return false;
      if (now - lastSameAt < __ccHapticState.minSameGapMs) return false;
      __ccHapticState.lastAnyAt = now;
      __ccHapticState.lastByKey[key] = now;
      return true;
    }
    
    // Haptic feedback helpers for iOS WebView and iPad
    window.triggerHapticImpact = function(style = 'medium') {
      try {
        // Check if haptics are enabled
        if (window._settings && !window._settings.hapticsEnabled) return;
        const hapticKey = 'impact:' + style;
        if (!shouldSendHaptic(hapticKey, style)) return;
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.hapticImpact) {
          Promise.resolve().then(() => {
            window.webkit.messageHandlers.hapticImpact.postMessage({ style: style });
          }).catch((e) => {
            if (e && e.message && e.message.includes('message channel')) return;
          });
          return;
        }
        if (navigator.vibrate && window.__ccUserInteracted === true) {
          const duration = style === 'heavy' ? 70 : style === 'light' ? 30 : 50;
          navigator.vibrate(duration);
          return;
        }
      } catch (e) {
        if (e && e.message && e.message.includes('message channel')) return;
      }
    };
    
    window.triggerHapticSelection = function() {
      try {
        // Check if haptics are enabled
        if (window._settings && !window._settings.hapticsEnabled) return;
        if (!shouldSendHaptic('selection', 'selection')) return;
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.hapticSelection) {
          Promise.resolve().then(() => {
            window.webkit.messageHandlers.hapticSelection.postMessage({});
          }).catch((e) => {
            if (e && e.message && e.message.includes('message channel')) return;
          });
          return;
        }
        if (navigator.vibrate && window.__ccUserInteracted === true) {
          navigator.vibrate(30);
          return;
        }
      } catch (e) {
        if (e && e.message && e.message.includes('message channel')) return;
      }
    };
    
    window.triggerHapticNotification = function(type = 'success') {
      try {
        // Check if haptics are enabled
        if (window._settings && !window._settings.hapticsEnabled) return;
        if (!shouldSendHaptic('notification:' + type, 'notification')) return;
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.hapticNotification) {
          Promise.resolve().then(() => {
            window.webkit.messageHandlers.hapticNotification.postMessage({ style: type });
          }).catch((e) => {
            if (e && e.message && e.message.includes('message channel')) return;
          });
          return;
        }
        if (navigator.vibrate && window.__ccUserInteracted === true) {
          const duration = type === 'error' ? 100 : type === 'warning' ? 70 : 50;
          navigator.vibrate(duration);
          return;
        }
      } catch (e) {
        if (e && e.message && e.message.includes('message channel')) return;
      }
    };
    
    // Backwards compatibility
    window.triggerHaptic = function() {
      window.triggerHapticImpact('medium');
    };
    
    // 🔥 FIX: Global handler to suppress browser extension message channel errors
    window.addEventListener('unhandledrejection', function(event) {
      const error = event.reason;
      // Suppress common browser extension message channel errors
      if (error) {
        const errorMessage = error.message || error.toString() || '';
        if (errorMessage.includes('message channel closed') || 
            errorMessage.includes('message channel') ||
            errorMessage.includes('asynchronous response') ||
            errorMessage.includes('A listener indicated an asynchronous response')) {
          event.preventDefault(); // Prevent error from showing in console
          event.stopPropagation(); // Stop propagation
          return false; // Return false to suppress
        }
      }
      // Let other unhandled rejections through
    });
    
    // 🔥 FIX: Also catch errors in window.onerror
    window.addEventListener('error', function(event) {
      const errorMessage = event.message || event.error?.message || '';
      if (errorMessage.includes('message channel closed') || 
          errorMessage.includes('message channel') ||
          errorMessage.includes('asynchronous response') ||
          errorMessage.includes('A listener indicated an asynchronous response')) {
        event.preventDefault(); // Prevent error from showing in console
        return false; // Return false to suppress
      }
    }, true); // Use capture phase
    
    // Expose saveSettings globally for ui-manager
    window.saveSettings = saveSettings;
    
    // Fix mobile viewport height
    function setViewportHeight() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    
    setViewportHeight();
    window.addEventListener('resize', setViewportHeight);
    window.addEventListener('orientationchange', setViewportHeight);
    
    // Lock orientation to portrait
    if (window.screen && window.screen.orientation && window.screen.orientation.lock) {
      window.screen.orientation.lock('portrait').catch(function() {});
    }
    
    // Prevent landscape orientation by detecting and warning
    window.addEventListener('orientationchange', function() {
      const isLandscape = window.outerWidth > window.outerHeight;
      if (isLandscape) alert('Please rotate your device to portrait mode for the best experience.');
    });
    window.addEventListener('resize', function() {
      const isLandscape = window.outerWidth > window.outerHeight;
      if (isLandscape) { /* prompt portrait */ }
    });
  </script>
  
  <!-- 🔥 CRITICAL: Start launch screen sequence IMMEDIATELY (DOM already exists in HTML) -->
  <script type="module">
    import { launchScreen } from './src/modules/launch-screen.ts';

    function startLaunchScreenSequence() {
      // The Stack to Six launch screen owns critical image preloading.
      launchScreen.init();
      launchScreen.start(function() {}).catch(function(error) {
        console.error('❌ Launch screen sequence error:', error);
        console.error('Error details:', error.stack);
        launchScreen.dispose('inline-start-error');
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startLaunchScreenSequence, { once: true });
    } else {
      startLaunchScreenSequence();
    }
  </script>
  
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
