<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CubeCrash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <!-- apple-mobile-web-app-capable is legacy; mobile-web-app-capable is the new standard -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="screen-orientation" content="portrait">
  <meta name="orientation" content="portrait">
  <!-- 🔥 CRITICAL: Set #F9F9F9 background IMMEDIATELY in inline style (before CSS loads) -->
  <!-- This prevents gradient from showing before launch screen sets white background -->
  <style>
    html, body {
      background: #F9F9F9 !important;
      background-color: #F9F9F9 !important;
      background-image: none !important;
    }
  </style>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.ico">
  
  <!-- Load LTCrow font first -->
  <link rel="stylesheet" href="./src/styles/fonts.css">
  
  <!-- 🔥 CRITICAL: Preload launch screen logos FIRST (before anything else) -->
  <link rel="preload" as="image" href="./assets/taptapdesign.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/logo-cube-crash.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/logo addons/smokeandshards.png" fetchpriority="high">
  <!-- Preload homepage shards for instant display -->
  <link rel="preload" as="image" href="./assets/logo addons/gore ljevo shards.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/logo addons/shards gore desno.png" fetchpriority="high">
  
  <!-- Preload navigation icons for instant display -->
  <link rel="preload" as="image" href="./assets/nav/cube-nav.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/nav/stats-nav.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/nav/collectibles-nav.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/nav/settings-nav.png" fetchpriority="high">
  <!-- Preload homepage hero + logo/shards to prevent blank slides -->
  <link rel="preload" as="image" href="./assets/crash-cubes-homepage.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/crash-cubes-homepage@2x.png">
  <link rel="preload" as="image" href="./assets/crash-cubes-homepage@3x.png">
  <link rel="preload" as="image" href="./assets/logo-cube-crash.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/logo addons/gore ljevo shards.png">
  <link rel="preload" as="image" href="./assets/logo addons/shards gore desno.png">
  <link rel="preload" as="image" href="./assets/home-shadow.png">
  <!-- Preload paper texture for bottom sheets (used in CSS background) -->
  <link rel="preload" as="image" href="./assets/modals/paper.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/modals/paper@2x.png">
  <link rel="preload" as="image" href="./assets/modals/paper@3x.png">
  <!-- Preload homepage hero art to avoid blank slide 1 -->
  <link rel="preload" as="image" href="./assets/crash-cubes-homepage.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/crash-cubes-homepage@2x.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/crash-cubes-homepage@3x.png" fetchpriority="high">
  
  <!-- Load critical CSS -->
  <link rel="stylesheet" href="./src/style.css">
  <link rel="stylesheet" href="./src/slider-optimized.css">
  <link rel="stylesheet" href="./src/independent-navigation.css">
  <link rel="stylesheet" href="./src/collectibles-screen.css">
  
  <style>
    * { 
      box-sizing: border-box;
      /* GLOBAL: Disable text selection and long-press menu everywhere */
      -webkit-user-select: none !important;
      -webkit-touch-callout: none !important;
      -khtml-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      /* iOS: Disable text selection and long-press menu */
      -webkit-user-select: none !important;
      -webkit-touch-callout: none !important;
      user-select: none !important;
    }
    
    body {
      /* 🔥 CRITICAL: Start with #F9F9F9 background for logo screen, matches launch screen */
      /* Background will be changed to gradient by launch-screen.ts and ui-manager.ts */
      background: #F9F9F9; /* Removed !important - JavaScript will override with gradient */
      background-color: #F9F9F9;
      background-attachment: fixed;
      background-repeat: no-repeat;
      font-family: 'LTCrow', system-ui, -apple-system, sans-serif;
      position: relative;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
    }
    
    /* 🔥 CRITICAL: No gradient here - launch-screen.ts handles all background changes */
    /* Background stays #F9F9F9 until Phase 2, then gradient is set by JavaScript */
    
    #ui-root {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
    }
    
    #nav-root {
      position: relative;
      z-index: 999999;
    }
    
    /* HIDE ALL SCREENS BY DEFAULT */
    #home,
    #stats-screen,
    #collectibles-screen,
    #menu-screen,
    #collectibles-detail-modal {
      display: none !important;
      visibility: hidden !important;
    }
    
    /* Settings screen visibility handled by style.css */
    #settings-screen {
      display: none;
      visibility: hidden;
    }
    
    /* #app is controlled by JavaScript, not CSS */
    
    /* Navigation is controlled by JS, not CSS */
    #independent-nav {
      visibility: hidden;
    }
    
    /* ONLY loading-screen visible by default */
    #loading-screen {
      display: flex !important;
      visibility: visible !important;
    }
    
    #home:not([hidden]) {
      display: block !important;
      visibility: visible !important;
    }
    
    #home:not([hidden]) #slider-container {
      display: block !important;
      visibility: visible !important;
    }
    
    /* Ensure stats screen is visible when shown (not hidden) */
    #stats-screen:not([hidden]) {
      display: flex !important;
      visibility: visible !important;
    }
    
    /* Ensure collectibles screen is visible when shown (not hidden) */
    #collectibles-screen:not([hidden]):not(.hidden) {
      display: flex !important;
      visibility: visible !important;
    }
    
    /* Ensure collectibles detail modal is visible when shown (not hidden) */
    #collectibles-detail-modal:not([hidden]):not(.hidden) {
      display: flex !important;
      visibility: visible !important;
    }
    
    /* No extra margin needed - navigation is separate */
  </style>
</head>
<body style="overflow: hidden;">
  <!-- 🔥 CRITICAL: Launch screen INLINE in HTML (no JavaScript delay) -->
  <div id="launch-screen" class="launch-screen" style="position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 10000 !important; display: flex !important; align-items: center !important; justify-content: center !important; background: #F9F9F9 !important; opacity: 1 !important; visibility: visible !important;">
    <div class="launch-content" style="position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
      <!-- Phase 1: Taptapdesign logo (VISIBLE IMMEDIATELY) -->
      <div class="launch-logo-taptap" style="position: absolute !important; width: 100% !important; height: 100% !important; display: flex !important; align-items: center !important; justify-content: center !important; opacity: 1 !important; visibility: visible !important;">
        <img id="launch-logo-taptap" src="./assets/taptapdesign.png" alt="TapTap Design" loading="eager" fetchpriority="high" style="width: 344px; height: auto; display: block; margin: 0 auto; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none; pointer-events: auto;" draggable="false">
      </div>
      <!-- Phase 2: Stack to six logo (hidden initially, will be shown by launch-screen.ts) -->
      <div class="launch-logo-stack" style="position: absolute !important; width: 100% !important; height: 100% !important; display: none !important; align-items: center !important; justify-content: center !important; opacity: 0 !important;">
        <img id="launch-smoke-shards" src="./assets/logo addons/smokeandshards.png" alt="" loading="eager" fetchpriority="high" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.6); width: 400px; height: auto; opacity: 1.0; z-index: 1; pointer-events: none; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none;" draggable="false">
        <img id="launch-logo-stack" src="./assets/logo-cube-crash.png" alt="CubeCrash" loading="eager" fetchpriority="high" style="width: 248px; height: auto; display: block; margin: 0 auto; position: relative; z-index: 2; opacity: 0; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none; pointer-events: auto;" draggable="false">
      </div>
    </div>
  </div>
  
  <!-- 🔥 PREMIUM: Disable image drag and long press immediately -->
  <script>
    (function() {
      function disableImageDrag(img) {
        if (!img) return;
        img.draggable = false;
        img.addEventListener('dragstart', function(e) { e.preventDefault(); });
        img.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        img.addEventListener('selectstart', function(e) { e.preventDefault(); });
        img.addEventListener('touchstart', function(e) {
          if (e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });
      }
      
      // Disable drag on launch screen images immediately
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          disableImageDrag(document.getElementById('launch-logo-taptap'));
          disableImageDrag(document.getElementById('launch-logo-stack'));
          disableImageDrag(document.getElementById('launch-smoke-shards'));
        });
      } else {
        disableImageDrag(document.getElementById('launch-logo-taptap'));
        disableImageDrag(document.getElementById('launch-logo-stack'));
        disableImageDrag(document.getElementById('launch-smoke-shards'));
      }
    })();
  </script>
  
  <!-- Inline critical loader with production styling -->
  <style>
    /* Inline critical loader styling matching production CSS */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      background: #F9F9F9; /* 🔥 CRITICAL: #F9F9F9 matches launch screen */
    }
    #loading-screen .loading-content {
      text-align: center;
      max-width: 400px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      position: relative;
    }
    /* 🔥 PREMIUM: Phase 1 - taptapdesign logo */
    #loading-screen .loading-logo-taptap {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    #loading-screen .loading-logo-taptap img {
      width: 344px; /* 🔥 30% larger than 265px: 265px * 1.3 = 344.5px */
      height: auto;
      display: block;
      margin: 0 auto; /* Center logo */
    }
    /* 🔥 PREMIUM: Phase 2 - stack to six logo + smokeandshards */
    #loading-screen .loading-logo-stack {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    #loading-screen .loading-logo-stack-img {
      width: 344px; /* 🔥 30% larger than 265px: 265px * 1.3 = 344.5px */
      height: auto;
      display: block;
      position: relative;
      z-index: 2;
      margin: 0 auto; /* Center logo */
    }
    #loading-screen .loading-smoke-shards {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: auto;
      opacity: 0.3;
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    /* Hide old loading elements */
    #loading-screen .loading-text,
    #loading-screen .loading-progress,
    #loading-screen .loading-bar-container {
      display: none !important;
    }
  </style>
  <!-- Loading screen will be created dynamically by loading-screen.ts component -->
  <!-- Empty div removed - loading screen is created in bootstrap-ui.ts -->

  <div id="ui-root"></div>
  <div id="nav-root"></div>
  
  <script>
    // Global settings state with localStorage persistence
    function loadSettings() {
      try {
        const saved = localStorage.getItem('cc_settings');
        if (saved) {
          return JSON.parse(saved);
        }
      } catch (e) {}
      // Default settings
      return {
        hapticsEnabled: true,
        gameSoundsEnabled: false,
        musicEnabled: true
      };
    }
    
    function saveSettings(settings) {
      try {
        localStorage.setItem('cc_settings', JSON.stringify(settings));
      } catch (e) {}
    }
    
    window._settings = loadSettings();
    window.__ccUserInteracted = false;
    const __ccMarkUserInteracted = () => {
      window.__ccUserInteracted = true;
      try { window.removeEventListener('pointerdown', __ccMarkUserInteracted, true); } catch (e) {}
      try { window.removeEventListener('touchstart', __ccMarkUserInteracted, true); } catch (e) {}
      try { window.removeEventListener('keydown', __ccMarkUserInteracted, true); } catch (e) {}
    };
    try { window.addEventListener('pointerdown', __ccMarkUserInteracted, true); } catch (e) {}
    try { window.addEventListener('touchstart', __ccMarkUserInteracted, true); } catch (e) {}
    try { window.addEventListener('keydown', __ccMarkUserInteracted, true); } catch (e) {}
    
    // Haptic feedback helpers for iOS WebView and iPad
    window.triggerHapticImpact = function(style = 'medium') {
      try {
        // Check if haptics are enabled
        if (window._settings && !window._settings.hapticsEnabled) return;
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.hapticImpact) {
          Promise.resolve().then(() => {
            window.webkit.messageHandlers.hapticImpact.postMessage({ style: style });
          }).catch((e) => {
            if (e && e.message && e.message.includes('message channel')) return;
          });
          return;
        }
        if (navigator.vibrate && window.__ccUserInteracted === true) {
          const duration = style === 'heavy' ? 70 : style === 'light' ? 30 : 50;
          navigator.vibrate(duration);
          return;
        }
      } catch (e) {
        if (e && e.message && e.message.includes('message channel')) return;
      }
    };
    
    window.triggerHapticSelection = function() {
      try {
        // Check if haptics are enabled
        if (window._settings && !window._settings.hapticsEnabled) return;
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.hapticSelection) {
          Promise.resolve().then(() => {
            window.webkit.messageHandlers.hapticSelection.postMessage({});
          }).catch((e) => {
            if (e && e.message && e.message.includes('message channel')) return;
          });
          return;
        }
        if (navigator.vibrate && window.__ccUserInteracted === true) {
          navigator.vibrate(30);
          return;
        }
      } catch (e) {
        if (e && e.message && e.message.includes('message channel')) return;
      }
    };
    
    window.triggerHapticNotification = function(type = 'success') {
      try {
        // Check if haptics are enabled
        if (window._settings && !window._settings.hapticsEnabled) return;
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.hapticNotification) {
          Promise.resolve().then(() => {
            window.webkit.messageHandlers.hapticNotification.postMessage({ style: type });
          }).catch((e) => {
            if (e && e.message && e.message.includes('message channel')) return;
          });
          return;
        }
        if (navigator.vibrate && window.__ccUserInteracted === true) {
          const duration = type === 'error' ? 100 : type === 'warning' ? 70 : 50;
          navigator.vibrate(duration);
          return;
        }
      } catch (e) {
        if (e && e.message && e.message.includes('message channel')) return;
      }
    };
    
    // Backwards compatibility
    window.triggerHaptic = function() {
      window.triggerHapticImpact('medium');
    };
    
    // 🔥 FIX: Global handler to suppress browser extension message channel errors
    window.addEventListener('unhandledrejection', function(event) {
      const error = event.reason;
      // Suppress common browser extension message channel errors
      if (error) {
        const errorMessage = error.message || error.toString() || '';
        if (errorMessage.includes('message channel closed') || 
            errorMessage.includes('message channel') ||
            errorMessage.includes('asynchronous response') ||
            errorMessage.includes('A listener indicated an asynchronous response')) {
          event.preventDefault(); // Prevent error from showing in console
          event.stopPropagation(); // Stop propagation
          return false; // Return false to suppress
        }
      }
      // Let other unhandled rejections through
    });
    
    // 🔥 FIX: Also catch errors in window.onerror
    window.addEventListener('error', function(event) {
      const errorMessage = event.message || event.error?.message || '';
      if (errorMessage.includes('message channel closed') || 
          errorMessage.includes('message channel') ||
          errorMessage.includes('asynchronous response') ||
          errorMessage.includes('A listener indicated an asynchronous response')) {
        event.preventDefault(); // Prevent error from showing in console
        return false; // Return false to suppress
      }
    }, true); // Use capture phase
    
    // Expose saveSettings globally for ui-manager
    window.saveSettings = saveSettings;
    
    // Fix mobile viewport height
    function setViewportHeight() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    
    setViewportHeight();
    window.addEventListener('resize', setViewportHeight);
    window.addEventListener('orientationchange', setViewportHeight);
    
    // Lock orientation to portrait
    if (window.screen && window.screen.orientation && window.screen.orientation.lock) {
      window.screen.orientation.lock('portrait').catch(function() {});
    } else if (window.DeviceOrientationEvent && window.DeviceOrientationEvent.requestPermission) {
      window.DeviceOrientationEvent.requestPermission()
        .then(function() {})
        .catch(function() {});
    }
    
    // Prevent landscape orientation by detecting and warning
    window.addEventListener('orientationchange', function() {
      const isLandscape = window.outerWidth > window.outerHeight;
      if (isLandscape) alert('Please rotate your device to portrait mode for the best experience.');
    });
    window.addEventListener('resize', function() {
      const isLandscape = window.outerWidth > window.outerHeight;
      if (isLandscape) { /* prompt portrait */ }
    });
  </script>
  
  <!-- 🔥 CRITICAL: Start launch screen sequence IMMEDIATELY (DOM already exists in HTML) -->
  <script>
    (function startLaunchScreenSequence() {
      // Only run if DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startLaunchScreenSequence);
        return;
      }
      
      // Launch screen Phase 2 preloads critical images; no preload here
      import('./src/modules/launch-screen.ts').then(function(module) {
        const launchScreen = module.launchScreen;
        launchScreen.init();
        launchScreen.start(function() {}).catch(function(error) {
          console.error('❌ Launch screen sequence error:', error);
          console.error('Error details:', error.stack);
        });
      }).catch(function(error) {
        console.error('❌ Failed to initialize launch screen:', error);
        console.error('Error details:', error.stack);
      });
    })();
  </script>
  
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
