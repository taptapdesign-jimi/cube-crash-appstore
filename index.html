<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CubeCrash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="screen-orientation" content="portrait">
  <meta name="orientation" content="portrait">
  <!-- 🔥 CRITICAL: Set #FAFAFA background IMMEDIATELY in inline style (before CSS loads) -->
  <!-- This prevents gradient from showing before launch screen sets white background -->
  <style>
    html, body {
      background: #FAFAFA !important;
      background-color: #FAFAFA !important;
      background-image: none !important;
    }
  </style>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.ico">
  
  <!-- Load LTCrow font first -->
  <link rel="stylesheet" href="./src/styles/fonts.css">
  
  <!-- Preload navigation icons for instant display -->
  <link rel="preload" as="image" href="./assets/nav/cube-nav.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/nav/stats-nav.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/nav/collectibles-nav.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/nav/settings-nav.png" fetchpriority="high">
  <!-- Preload homepage hero + logo/shards to prevent blank slides -->
  <link rel="preload" as="image" href="./assets/crash-cubes-homepage.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/crash-cubes-homepage@2x.png">
  <link rel="preload" as="image" href="./assets/crash-cubes-homepage@3x.png">
  <link rel="preload" as="image" href="./assets/logo-cube-crash.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/logo addons/gore ljevo shards.png">
  <link rel="preload" as="image" href="./assets/logo addons/shards gore desno.png">
  <link rel="preload" as="image" href="./assets/home-shadow.png">
  <!-- Preload paper texture for bottom sheets (used in CSS background) -->
  <link rel="preload" as="image" href="./assets/modals/paper.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/modals/paper@2x.png">
  <link rel="preload" as="image" href="./assets/modals/paper@3x.png">
  <!-- Preload homepage hero art to avoid blank slide 1 -->
  <link rel="preload" as="image" href="./assets/crash-cubes-homepage.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/crash-cubes-homepage@2x.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/crash-cubes-homepage@3x.png" fetchpriority="high">
  
  <!-- Load critical CSS -->
  <link rel="stylesheet" href="./src/style.css">
  <link rel="stylesheet" href="./src/slider-optimized.css">
  <link rel="stylesheet" href="./src/independent-navigation.css">
  <link rel="stylesheet" href="./src/collectibles-screen.css">
  
  <style>
    * { 
      box-sizing: border-box;
      /* GLOBAL: Disable text selection and long-press menu everywhere */
      -webkit-user-select: none !important;
      -webkit-touch-callout: none !important;
      -khtml-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      /* iOS: Disable text selection and long-press menu */
      -webkit-user-select: none !important;
      -webkit-touch-callout: none !important;
      user-select: none !important;
    }
    
    body {
      /* 🔥 CRITICAL: Start with #FAFAFA background for logo screen, matches launch screen */
      /* Background will be changed to gradient by launch-screen.ts and ui-manager.ts */
      background: #FAFAFA; /* Removed !important - JavaScript will override with gradient */
      background-color: #FAFAFA;
      background-attachment: fixed;
      background-repeat: no-repeat;
      font-family: 'LTCrow', system-ui, -apple-system, sans-serif;
      position: relative;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
    }
    
    /* 🔥 CRITICAL: No gradient here - launch-screen.ts handles all background changes */
    /* Background stays #FAFAFA until Phase 2, then gradient is set by JavaScript */
    
    #ui-root {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
    }
    
    #nav-root {
      position: relative;
      z-index: 999999;
    }
    
    /* HIDE ALL SCREENS BY DEFAULT */
    #home,
    #stats-screen,
    #collectibles-screen,
    #menu-screen,
    #collectibles-detail-modal {
      display: none !important;
      visibility: hidden !important;
    }
    
    /* Settings screen visibility handled by style.css */
    #settings-screen {
      display: none;
      visibility: hidden;
    }
    
    /* #app is controlled by JavaScript, not CSS */
    
    /* Navigation is controlled by JS, not CSS */
    #independent-nav {
      visibility: hidden;
    }
    
    /* ONLY loading-screen visible by default */
    #loading-screen {
      display: flex !important;
      visibility: visible !important;
    }
    
    /* Ensure slider is visible when home is shown */
    #home:not([hidden]) {
      display: block !important;
      visibility: visible !important;
    }
    
    #home:not([hidden]) #slider-container {
      display: block !important;
      visibility: visible !important;
    }
    
    /* Ensure stats screen is visible when shown (not hidden) */
    #stats-screen:not([hidden]) {
      display: flex !important;
      visibility: visible !important;
    }
    
    /* Ensure collectibles screen is visible when shown (not hidden) */
    #collectibles-screen:not([hidden]):not(.hidden) {
      display: flex !important;
      visibility: visible !important;
    }
    
    /* Ensure collectibles detail modal is visible when shown (not hidden) */
    #collectibles-detail-modal:not([hidden]):not(.hidden) {
      display: flex !important;
      visibility: visible !important;
    }
    
    /* No extra margin needed - navigation is separate */
  </style>
</head>
<body style="overflow: hidden;">
  <!-- Inline critical loader with production styling -->
  <style>
    /* Inline critical loader styling matching production CSS */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      background: #FAFAFA; /* 🔥 CRITICAL: #FAFAFA matches launch screen */
    }
    #loading-screen .loading-content {
      text-align: center;
      max-width: 400px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      position: relative;
    }
    /* 🔥 PREMIUM: Phase 1 - taptapdesign logo */
    #loading-screen .loading-logo-taptap {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    #loading-screen .loading-logo-taptap img {
      width: 344px; /* 🔥 30% larger than 265px: 265px * 1.3 = 344.5px */
      height: auto;
      display: block;
      margin: 0 auto; /* Center logo */
    }
    /* 🔥 PREMIUM: Phase 2 - stack to six logo + smokeandshards */
    #loading-screen .loading-logo-stack {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    #loading-screen .loading-logo-stack-img {
      width: 344px; /* 🔥 30% larger than 265px: 265px * 1.3 = 344.5px */
      height: auto;
      display: block;
      position: relative;
      z-index: 2;
      margin: 0 auto; /* Center logo */
    }
    #loading-screen .loading-smoke-shards {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: auto;
      opacity: 0.3;
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    /* Hide old loading elements */
    #loading-screen .loading-text,
    #loading-screen .loading-progress,
    #loading-screen .loading-bar-container {
      display: none !important;
    }
  </style>
  <!-- Loading screen will be created dynamically by loading-screen.ts component -->
  <!-- Empty div removed - loading screen is created in bootstrap-ui.ts -->

  <div id="ui-root"></div>
  <div id="nav-root"></div>
  
  <script>
    console.log('✅ HTML loaded');
    
    // Global settings state with localStorage persistence
    function loadSettings() {
      try {
        const saved = localStorage.getItem('cc_settings');
        if (saved) {
          return JSON.parse(saved);
        }
      } catch (e) {
        console.warn('⚠️ Failed to load settings:', e);
      }
      // Default settings
      return {
        hapticsEnabled: true,
        gameSoundsEnabled: false
      };
    }
    
    function saveSettings(settings) {
      try {
        localStorage.setItem('cc_settings', JSON.stringify(settings));
        console.log('💾 Settings saved:', settings);
      } catch (e) {
        console.warn('⚠️ Failed to save settings:', e);
      }
    }
    
    window._settings = loadSettings();
    console.log('⚙️ Loaded settings:', window._settings);
    
    // Haptic feedback helpers for iOS WebView and iPad
    window.triggerHapticImpact = function(style = 'medium') {
      try {
        // Check if haptics are enabled
        if (window._settings && !window._settings.hapticsEnabled) {
          console.log('📳 Haptic disabled in settings, skipping');
          return;
        }
        
        // Try iOS WebView message handler first
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.hapticImpact) {
          window.webkit.messageHandlers.hapticImpact.postMessage({ style: style });
          console.log('📳 Haptic impact sent to iOS WebView:', style);
          return;
        }
        
        // Try iPad/iOS Safari with Vibration API (iPad Pro and newer iPads support haptics)
        if (navigator.vibrate) {
          const duration = style === 'heavy' ? 70 : style === 'light' ? 30 : 50;
          navigator.vibrate(duration);
          console.log('📳 Haptic fallback (vibrate):', style);
          return;
        }
        
        // Try iOS-specific haptic API for iPad (if available)
        if (window.DeviceMotionEvent && window.DeviceMotionEvent.requestPermission) {
          // iOS 13+ haptic feedback might be available through other APIs
          console.log('📳 Haptic API not available on this device');
        }
      } catch (e) {
        console.warn('⚠️ Haptic impact failed:', e);
      }
    };
    
    window.triggerHapticSelection = function() {
      try {
        // Check if haptics are enabled
        if (window._settings && !window._settings.hapticsEnabled) {
          console.log('📳 Haptic disabled in settings, skipping');
          return;
        }
        
        // Try iOS WebView message handler first
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.hapticSelection) {
          window.webkit.messageHandlers.hapticSelection.postMessage({});
          console.log('📳 Haptic selection sent to iOS WebView');
          return;
        }
        
        // Try iPad/iOS Safari with Vibration API
        if (navigator.vibrate) {
          navigator.vibrate(30);
          console.log('📳 Selection fallback (vibrate)');
          return;
        }
        
        console.log('📳 Haptic selection API not available on this device');
      } catch (e) {
        console.warn('⚠️ Haptic selection failed:', e);
      }
    };
    
    window.triggerHapticNotification = function(type = 'success') {
      try {
        // Check if haptics are enabled
        if (window._settings && !window._settings.hapticsEnabled) {
          console.log('📳 Haptic disabled in settings, skipping');
          return;
        }
        
        // Try iOS WebView message handler first
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.hapticNotification) {
          window.webkit.messageHandlers.hapticNotification.postMessage({ style: type });
          console.log('📳 Haptic notification sent to iOS WebView:', type);
          return;
        }
        
        // Try iPad/iOS Safari with Vibration API
        if (navigator.vibrate) {
          const duration = type === 'error' ? 100 : type === 'warning' ? 70 : 50;
          navigator.vibrate(duration);
          console.log('📳 Notification fallback (vibrate):', type);
          return;
        }
        
        console.log('📳 Haptic notification API not available on this device');
      } catch (e) {
        console.warn('⚠️ Haptic notification failed:', e);
      }
    };
    
    // Backwards compatibility
    window.triggerHaptic = function() {
      window.triggerHapticImpact('medium');
    };
    
    // Expose saveSettings globally for ui-manager
    window.saveSettings = saveSettings;
    
    // Fix mobile viewport height
    function setViewportHeight() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    
    setViewportHeight();
    window.addEventListener('resize', setViewportHeight);
    window.addEventListener('orientationchange', setViewportHeight);
    
    // Lock orientation to portrait
    if (window.screen && window.screen.orientation && window.screen.orientation.lock) {
      window.screen.orientation.lock('portrait').catch(function(err) {
        console.log('Orientation lock not supported:', err);
      });
    } else if (window.DeviceOrientationEvent && window.DeviceOrientationEvent.requestPermission) {
      // iOS 13+ - request permission first
      window.DeviceOrientationEvent.requestPermission()
        .then(function(response) {
          if (response === 'granted') {
            console.log('✅ Orientation lock granted');
          }
        })
        .catch(function(err) {
          console.log('Orientation lock permission denied:', err);
        });
    }
    
    // Prevent landscape orientation by detecting and warning
    window.addEventListener('orientationchange', function() {
      const isLandscape = window.outerWidth > window.outerHeight;
      if (isLandscape) {
        console.log('⚠️ Landscape orientation detected - please rotate to portrait');
        alert('Please rotate your device to portrait mode for the best experience.');
      }
    });
    
    // Also check on resize
    window.addEventListener('resize', function() {
      const isLandscape = window.outerWidth > window.outerHeight;
      if (isLandscape) {
        console.log('⚠️ Landscape orientation detected - please rotate to portrait');
      }
    });
  </script>
  
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
