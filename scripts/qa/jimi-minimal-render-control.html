<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>
html,body{margin:0;height:100%;overflow:hidden;background:#f3eee8;font:16px system-ui}main{position:relative;height:100%;isolation:isolate}h1{font-size:18px;position:absolute;top:45px;left:20px}p{position:absolute;top:80px;left:20px}.unit{position:absolute;width:220px;height:120px;left:85px;background:#6cc;top:150px;border-radius:20px}.unit:nth-of-type(2){top:340px;background:#c9c}.unit:nth-of-type(3){top:530px;background:#ec8}button{position:absolute;top:720px;left:85px;width:220px;height:64px;font:20px system-ui;touch-action:manipulation}
</style></head><body><main id="control"><h1>Minimal render control — not Jimi</h1><p>No images, GSAP, gameplay or navigation.</p><div class="unit"></div><div class="unit"></div><div class="unit"></div><button id="run">Run control</button></main><script>
(() => {
 const root=document.getElementById('control'),units=[...document.querySelectorAll('.unit')];
 let active=false,raf=0,count=0;
 const emit=(name,data)=>window.webkit?.messageHandlers?.consoleLog?.postMessage({level:'info',message:'[JIMI_MINIMAL_CONTROL] '+name+' '+JSON.stringify(data)});
 const stop=()=>{cancelAnimationFrame(raf);raf=0;active=false;root.inert=false;for(const unit of units)unit.style.removeProperty('transform');};
 document.getElementById('run').addEventListener('click',()=>{
  if(active||document.hidden)return;
  const useInert=count<3;
  const translate=count<6?'translate3d(0px,0px,0px)':'translate(0px,0px)';
  active=true;if(useInert)root.inert=true;
  const start=performance.now();let previous=start,worst=0,samples=0;const stalls=[];
  for(const unit of units)unit.style.transform=translate+' scale(1)';
  const tick=()=>{
   if(!active)return;
   const now=performance.now(),gap=now-previous,elapsed=now-start;
   worst=Math.max(worst,gap);samples++;if(gap>34&&stalls.length<32)stalls.push({at:Math.round(previous-start),gap:Math.round(gap)});previous=now;
   if(elapsed>=1400){stop();emit('complete',{run:++count,inert:useInert,translate,worst:Math.round(worst),samples,stalls});document.getElementById('run').textContent='Run control '+(count+1);return;}
   for(let i=0;i<units.length;i++){const phase=Math.min(1,Math.max(0,(elapsed-i*35)/1200));const scale=1-Math.sin(phase*Math.PI)*0.9;units[i].style.transform=translate+' scale('+scale+')';}
   raf=requestAnimationFrame(tick);
  };raf=requestAnimationFrame(tick);
 });
 window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
 emit('ready',{control:true});
})();
</script></body></html>
