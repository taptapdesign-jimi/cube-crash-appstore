name: Stack to Six QA

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  web-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic Stack to Six QA including Gameplay KING contract
        run: npm run qa:full
